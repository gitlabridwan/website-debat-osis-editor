<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Website interaktif pemilihan tema debat calon Ketua OSIS." />
  <title>Debat Calon Ketua OSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#2d2d83;--bg2:#671d91;--bg3:#9e3e71;--text:#fff;--radius:22px;--shadow:0 18px 45px rgba(14,5,50,.24);--speed:.3s}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;font-family:Poppins,system-ui,sans-serif;color:var(--text);background:linear-gradient(125deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);background-attachment:fixed}
    button,input,textarea,select{font:inherit} button{color:inherit} .app{min-height:100vh;padding:26px 24px 18px;overflow:hidden}.shell{width:min(1100px,100%);margin:auto}.header{text-align:center}.title{font-size:clamp(2rem,4.2vw,3.35rem);line-height:1.15;margin:0;font-weight:800;letter-spacing:.3px}.subtitle{font-size:clamp(.95rem,1.7vw,1.25rem);opacity:.8;margin:10px 0 30px}.notice{display:inline-flex;gap:12px;align-items:center;padding:14px 27px;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font-weight:600;backdrop-filter:blur(12px)}
    .view{animation:enter var(--speed) ease both}.category-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:30px;margin:48px auto 56px}.category-card{grid-column:span 2;min-height:286px}.category-card:nth-child(n+4){transform:translateX(50%)}.category-card:nth-child(n+6){transform:none}.card{border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform var(--speed),box-shadow var(--speed),filter var(--speed);outline:none}.card:hover,.card:focus-visible{transform:translateY(-8px) scale(1.018);box-shadow:0 26px 55px rgba(9,3,38,.34);filter:brightness(1.07)}.category-card:nth-child(n+4):hover,.category-card:nth-child(n+4):focus-visible{transform:translate(50%,-8px) scale(1.018)}.card-content{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}.emoji{font-size:4rem;filter:drop-shadow(0 7px 12px rgba(0,0,0,.16));line-height:1}.card h3{font-size:1.22rem;margin:18px 0 10px}.card p{margin:0;opacity:.73}.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.11);pointer-events:none}.orb.a{width:110px;height:110px;right:-42px;bottom:-42px}.orb.b{width:55px;height:55px;left:-18px;top:-18px}
    .toolbar{text-align:center;margin:42px 0 24px}.back,.primary{border:0;cursor:pointer;padding:13px 26px;border-radius:999px;background:linear-gradient(100deg,#a24ef0,#fa4d9d);font-weight:700;box-shadow:0 12px 24px rgba(45,9,88,.25);transition:.25s}.back:hover,.primary:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(45,9,88,.34)}.hero-panel{max-width:670px;margin:0 auto 44px;text-align:center;padding:27px 28px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.1);border-radius:var(--radius);backdrop-filter:blur(12px);box-shadow:var(--shadow)}.hero-panel h2{font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 8px}.hero-panel p{margin:0;opacity:.75}.dots{margin-top:16px}.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 4px}.sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-bottom:58px}.sub-card{min-height:255px}.sub-card .card-content{align-items:flex-start;text-align:left;justify-content:space-between}.letter{position:absolute;right:18px;top:18px;width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.17);font-size:1.8rem;font-weight:700}.sub-card .emoji{font-size:3.5rem}.sub-card h3{font-size:1.14rem;margin:0 0 9px}.sub-card p{font-size:.87rem}.question-wrap{max-width:820px;margin:0 auto 60px}.question-card{padding:36px;border-radius:var(--radius);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.13);box-shadow:var(--shadow);backdrop-filter:blur(15px);text-align:center}.question-icon{font-size:4.5rem}.badge{display:inline-block;margin:16px 0 9px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700}.question-card h2{margin:5px 0;font-size:clamp(1.6rem,3vw,2.4rem)}.question-label{text-transform:uppercase;letter-spacing:2px;font-size:.76rem;font-weight:800;opacity:.67;margin:28px 0 10px}.question-text{font-size:clamp(1.1rem,2vw,1.4rem);line-height:1.65;margin:0;padding:26px;border-radius:18px;background:rgba(15,6,45,.25)}
    .footer{text-align:center;padding:18px 22px;margin:0 auto;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);font-size:.88rem}.footer span{opacity:.7}.verified{color:#6cc6ff}.admin-trigger{position:fixed;right:18px;top:18px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(20,7,54,.35);backdrop-filter:blur(12px);cursor:pointer;z-index:20;transition:.2s}.admin-trigger:hover{transform:rotate(25deg) scale(1.08)}
    .overlay{position:fixed;inset:0;background:rgba(9,4,28,.72);display:grid;place-items:center;padding:18px;z-index:50;backdrop-filter:blur(8px)}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#24124c;border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);padding:27px}.modal.large{width:min(970px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.modal-head h2{margin:0}.icon-btn{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:38px;height:38px;cursor:pointer}.field{margin-bottom:16px}.field label{display:block;font-size:.84rem;font-weight:700;margin-bottom:7px;opacity:.85}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.08);color:white;padding:12px 14px;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#d570ff;box-shadow:0 0 0 3px rgba(213,112,255,.15)}.field option{color:#111}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.secondary,.danger{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);padding:11px 17px;border-radius:12px;cursor:pointer}.danger{background:#b93458}.admin-layout{display:grid;grid-template-columns:210px 1fr;gap:22px}.admin-nav{display:flex;flex-direction:column;gap:8px}.admin-nav button{border:0;text-align:left;padding:12px;border-radius:11px;background:transparent;cursor:pointer}.admin-nav button.active,.admin-nav button:hover{background:rgba(255,255,255,.11)}.admin-content{min-width:0}.edit-list{display:grid;gap:12px}.edit-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.07)}.edit-item strong{display:block}.edit-item small{opacity:.65}.mini-actions{display:flex;gap:7px}.mini-actions button{border:0;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.1);cursor:pointer}.admin-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:19;padding:10px 14px;border-radius:999px;background:#17102f;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;font-size:.82rem}.admin-bar button{border:0;border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.12);cursor:pointer}.inline-edit{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.3);cursor:pointer;z-index:3}.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:100;padding:12px 18px;border-radius:12px;background:#fff;color:#29104d;box-shadow:var(--shadow);font-weight:700;animation:toast .3s ease}.hidden{display:none!important}
    @keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes toast{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
    @media(max-width:850px){.category-grid{grid-template-columns:repeat(2,1fr)}.category-card{grid-column:auto}.category-card:nth-child(n+4){transform:none}.category-card:nth-child(n+4):hover,.category-card:nth-child(n+4):focus-visible{transform:translateY(-8px) scale(1.018)}.sub-grid{grid-template-columns:1fr 1fr}.admin-layout{grid-template-columns:1fr}.admin-nav{flex-direction:row;overflow:auto}}
    @media(max-width:580px){.app{padding:24px 16px 90px}.notice{padding:12px 17px;font-size:.82rem}.category-grid,.sub-grid{grid-template-columns:1fr;gap:18px;margin-top:32px}.category-card{min-height:225px}.sub-card{min-height:220px}.emoji{font-size:3.4rem}.question-card{padding:23px 17px}.admin-trigger{top:auto;bottom:18px}.admin-bar{width:calc(100% - 24px);justify-content:center}.footer{font-size:.78rem}.modal{padding:20px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script>
    const STORAGE_KEY='osisDebateWebsiteData'; const PIN_KEY='osisAdminPin';
    const defaults={version:1,identity:{title:'Debat Calon Ketua OSIS',school:'Embun Pagi Islamic School - Senior High',instruction:'Klik kartu untuk melihat topik debat yang akan dibahas!',creator:'Dimaswhyy'},appearance:{bg1:'#2d2d83',bg2:'#671d91',bg3:'#9e3e71'},categories:[
      {id:'visi',emoji:'🎯',name:'Visi, Misi & Goals',description:'Klik untuk melihat pilihan',colors:['#43c9a6','#35ad9e'],subtopics:[{id:'visi-a',label:'A',emoji:'🎯',name:'Implementasi Visi & Misi',question:'Visi dan misi Anda terlihat ideal. Bagaimana cara memastikan agar visi dan misi tersebut tidak hanya menjadi slogan, tetapi benar-benar dapat dilaksanakan?'},{id:'visi-b',label:'B',emoji:'💡',name:'Relevansi & Persuasif',question:'Mengapa visi dan misi yang Anda usung relevan dengan kebutuhan siswa saat ini, dan bagaimana Anda meyakinkan siswa untuk mendukungnya?'},{id:'visi-c',label:'C',emoji:'🚀',name:'Perencanaan Program & Timeline',question:'Bagaimana Anda menyusun prioritas dan timeline program agar seluruh janji dalam visi dan misi dapat dilaksanakan selama satu periode kepengurusan?'}]},
      {id:'leadership',emoji:'👑',name:'Leadership',description:'Klik untuk melihat pilihan',colors:['#f26662','#e84a51'],subtopics:[{id:'lead-a',label:'A',emoji:'🎯',name:'Motivasi',question:'Apa motivasi utama Anda menjadi Ketua OSIS, dan bagaimana motivasi tersebut akan membantu Anda menghadapi tekanan selama masa kepengurusan?'},{id:'lead-b',label:'B',emoji:'💡',name:'Teladan',question:'Bagaimana Anda menunjukkan keteladanan kepada siswa lain ketika aturan atau keputusan yang dibuat juga membatasi diri Anda sendiri?'},{id:'lead-c',label:'C',emoji:'🚀',name:'Tanggung Jawab',question:'Jika program yang Anda pimpin mengalami kegagalan, bentuk tanggung jawab seperti apa yang akan Anda tunjukkan kepada anggota dan seluruh siswa?'}]},
      {id:'manajemen',emoji:'⚙️',name:'Manajemen Organisasi',description:'Klik untuk melihat pilihan',colors:['#ec5aa8','#dc4699'],subtopics:[{id:'man-a',label:'A',emoji:'🎯',name:'Koordinasi',question:'Bagaimana cara Anda menjaga koordinasi antarseksi dan memastikan tidak terjadi miskomunikasi selama pelaksanaan program OSIS?'},{id:'man-b',label:'B',emoji:'💡',name:'Timeline',question:'Bagaimana Anda mengatur timeline beberapa program yang berjalan berdekatan agar semuanya dapat terlaksana secara efektif?'},{id:'man-c',label:'C',emoji:'🚀',name:'Sistem Tanggung Jawab',question:'Sistem apa yang akan Anda gunakan untuk memastikan setiap pengurus memahami dan menyelesaikan tanggung jawabnya?'}]},
      {id:'kolaborasi',emoji:'🤝',name:'Kolaborasi & Kreativitas',description:'Klik untuk melihat pilihan',colors:['#515b70','#384052'],subtopics:[{id:'kol-a',label:'A',emoji:'🎯',name:'Teamwork',question:'Bagaimana Anda menangani anggota tim yang pasif atau sulit diajak bekerja sama tanpa merusak hubungan dalam organisasi?'},{id:'kol-b',label:'B',emoji:'💡',name:'Inovasi',question:'Inovasi apa yang ingin Anda hadirkan dalam kegiatan OSIS, dan bagaimana memastikan inovasi tersebut benar-benar dibutuhkan siswa?'},{id:'kol-c',label:'C',emoji:'🚀',name:'Kolaborasi',question:'Bagaimana strategi Anda membangun kolaborasi antara OSIS, siswa, guru, dan organisasi lain di sekolah?'}]},
      {id:'budaya',emoji:'🌍',name:'Budaya & Lingkungan Sosial',description:'Klik untuk melihat pilihan',colors:['#5790f5','#4478e4'],subtopics:[{id:'bud-a',label:'A',emoji:'🎯',name:'Disiplin',question:'Bagaimana Anda membangun budaya disiplin tanpa membuat siswa merasa terlalu dikontrol atau ditekan?'},{id:'bud-b',label:'B',emoji:'💡',name:'Solidaritas',question:'Apa langkah nyata yang akan Anda lakukan untuk meningkatkan solidaritas dan mengurangi kelompok-kelompok eksklusif di lingkungan sekolah?'},{id:'bud-c',label:'C',emoji:'🚀',name:'Lingkungan',question:'Program lingkungan seperti apa yang realistis untuk dilaksanakan OSIS dan bagaimana menjaga agar program tersebut dapat berkelanjutan?'}]}
    ]};
    let data=loadData(), view='home', selectedCategory=null, selectedSubtopic=null, admin=sessionStorage.getItem('osisAdmin')==='true', adminTab='identity';
    function clone(v){return JSON.parse(JSON.stringify(v))} function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||clone(defaults)}catch{return clone(defaults)}}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));applyTheme();toast('Perubahan berhasil disimpan');render()}
    function applyTheme(){document.documentElement.style.setProperty('--bg1',data.appearance.bg1);document.documentElement.style.setProperty('--bg2',data.appearance.bg2);document.documentElement.style.setProperty('--bg3',data.appearance.bg3);document.title=data.identity.title}
    function go(next,cat=null,sub=null){view=next;selectedCategory=cat;selectedSubtopic=sub;window.scrollTo({top:0,behavior:'smooth'});render()}
    function header(){return `<header class="header"><h1 class="title">${esc(data.identity.title)}</h1><p class="subtitle">${esc(data.identity.school)}</p><div class="notice">🏆 <span>${esc(data.identity.instruction)}</span></div></header>`}
    function editButton(type,id=''){return admin?`<button class="inline-edit" aria-label="Edit" onclick="event.stopPropagation();openEditor('${type}','${id}')">✎</button>`:''}
    function home(){return `<section class="view"><div class="category-grid">${data.categories.map(c=>`<article class="card category-card" tabindex="0" role="button" aria-label="Buka ${esc(c.name)}" style="background:linear-gradient(145deg,${c.colors[0]},${c.colors[1]})" onclick="go('category','${c.id}')" onkeydown="if(event.key==='Enter'||event.key===' ')go('category','${c.id}')"><i class="orb a"></i><i class="orb b"></i>${editButton('category',c.id)}<div class="card-content"><div class="emoji">${esc(c.emoji)}</div><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p></div></article>`).join('')}</div></section>`}
    function categoryView(){const c=data.categories.find(x=>x.id===selectedCategory);if(!c)return go('home');return `<section class="view"><div class="toolbar"><button class="back" onclick="go('home')">← Kembali ke Topik</button></div><div class="hero-panel"><h2>${esc(c.emoji)} ${esc(c.name)}</h2><p>Pilih salah satu poin untuk melihat pertanyaan debat</p><div class="dots"><i style="background:#ffd92f"></i><i style="background:#49d69c"></i><i style="background:#56a4f5"></i></div></div><div class="sub-grid">${c.subtopics.map((s,i)=>{const colors=[['#e8483f','#cf322e'],['#3985df','#2362c2'],['#22b45a','#109444']][i%3];return `<article class="card sub-card" tabindex="0" role="button" style="background:linear-gradient(145deg,${colors[0]},${colors[1]})" onclick="go('question','${c.id}','${s.id}')" onkeydown="if(event.key==='Enter'||event.key===' ')go('question','${c.id}','${s.id}')"><i class="orb a"></i><i class="orb b"></i>${editButton('subtopic',s.id)}<div class="letter">${esc(s.label)}</div><div class="card-content"><div class="emoji">${esc(s.emoji)}</div><div><h3>${esc(s.name)}</h3><p>Klik untuk melihat pertanyaan&nbsp; →</p></div></div></article>`}).join('')}</div></section>`}
    function questionView(){const c=data.categories.find(x=>x.id===selectedCategory),s=c?.subtopics.find(x=>x.id===selectedSubtopic);if(!s)return go('home');return `<section class="view question-wrap"><div class="toolbar"><button class="back" onclick="go('category','${c.id}')">← Kembali ke Pilihan</button></div><article class="question-card" style="position:relative">${editButton('subtopic',s.id)}<div class="question-icon">${esc(c.emoji)}</div><h2>${esc(c.name)}</h2><div class="badge">Poin ${esc(s.label)} · ${esc(s.name)}</div><div class="question-label">Pertanyaan Debat</div><p class="question-text">${esc(s.question)}</p></article></section>`}
    function footer(){return `<footer class="footer"><strong>${esc(data.identity.school)}</strong> <span>| &nbsp;Powered by :</span> <strong class="verified">${esc(data.identity.creator)} ●</strong></footer>`}
    function render(){applyTheme();document.getElementById('app').innerHTML=`<main class="app"><div class="shell">${header()}${view==='home'?home():view==='category'?categoryView():questionView()}${footer()}</div></main><button class="admin-trigger" aria-label="Pengaturan admin" onclick="${admin?'openAdmin()':'openLogin()'}">⚙️</button>${admin?`<div class="admin-bar"><b>Mode Admin</b><button onclick="openAdmin()">Kelola Konten</button><button onclick="logout()">Keluar</button></div>`:''}`}
    function modal(html,large=false){const el=document.createElement('div');el.className='overlay';el.id='modal';el.innerHTML=`<div class="modal ${large?'large':''}" role="dialog" aria-modal="true">${html}</div>`;el.addEventListener('click',e=>{if(e.target===el)closeModal()});document.body.appendChild(el)} function closeModal(){document.getElementById('modal')?.remove()}
    function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
    function openLogin(){modal(`<div class="modal-head"><h2>Masuk Mode Admin</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="login(event)"><div class="field"><label>PIN Admin</label><input id="pin" type="password" inputmode="numeric" maxlength="12" required autofocus></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">Masuk</button></div></form>`)}
    async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    async function login(e){e.preventDefault();const pin=document.getElementById('pin').value, stored=localStorage.getItem(PIN_KEY);const value=await hash(pin);if((stored&&value===stored)||(!stored&&pin==='123456')){if(!stored)localStorage.setItem(PIN_KEY,value);admin=true;sessionStorage.setItem('osisAdmin','true');closeModal();render();toast('Mode Admin aktif')}else toast('PIN tidak sesuai')}
    function logout(){admin=false;sessionStorage.removeItem('osisAdmin');render();toast('Mode Admin dinonaktifkan')}
    function openAdmin(tab=adminTab){adminTab=tab;const nav=[['identity','Identitas'],['categories','Tema & Pertanyaan'],['appearance','Tampilan'],['backup','Backup'],['security','Keamanan']];modal(`<div class="modal-head"><h2>Dashboard Admin</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="admin-layout"><nav class="admin-nav">${nav.map(n=>`<button class="${tab===n[0]?'active':''}" onclick="closeModal();openAdmin('${n[0]}')">${n[1]}</button>`).join('')}</nav><section class="admin-content">${adminPanel(tab)}</section></div>`,true)}
    function adminPanel(tab){if(tab==='identity')return `<form onsubmit="saveIdentity(event)">${field('Judul','ad-title',data.identity.title)}${field('Nama sekolah','ad-school',data.identity.school)}${field('Teks instruksi','ad-instruction',data.identity.instruction)}${field('Nama pembuat','ad-creator',data.identity.creator)}<div class="actions"><button class="primary">Simpan Perubahan</button></div></form>`;if(tab==='categories')return `<div class="edit-list">${data.categories.map(c=>`<div class="edit-item"><div><strong>${esc(c.emoji)} ${esc(c.name)}</strong><small>${c.subtopics.length} subtopik</small></div><div class="mini-actions"><button onclick="closeModal();openEditor('category','${c.id}')">Edit tema</button>${c.subtopics.map(s=>`<button title="${esc(s.name)}" onclick="closeModal();openEditor('subtopic','${s.id}')">${esc(s.label)}</button>`).join('')}</div></div>`).join('')}</div>`;if(tab==='appearance')return `<form onsubmit="saveAppearance(event)">${colorField('Warna latar 1','bg1',data.appearance.bg1)}${colorField('Warna latar 2','bg2',data.appearance.bg2)}${colorField('Warna latar 3','bg3',data.appearance.bg3)}<div class="actions"><button class="primary">Simpan Tampilan</button></div></form>`;if(tab==='backup')return `<h3>Backup & Pemulihan</h3><p style="opacity:.7">Unduh semua konten sebagai JSON atau pulihkan dari file backup.</p><div class="actions" style="justify-content:flex-start"><button class="secondary" onclick="exportData()">Unduh JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON</button><button class="danger" onclick="resetData()">Reset Data Awal</button></div>`;return `<form onsubmit="changePin(event)">${field('PIN baru','newpin','', 'password')}${field('Ulangi PIN baru','confirmpin','', 'password')}<div class="actions"><button class="primary">Ubah PIN</button></div></form>`}
    function field(label,id,value,type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" required></div>`} function colorField(label,id,value){return `<div class="field"><label>${label}</label><input id="${id}" type="color" value="${value}"></div>`}
    function saveIdentity(e){e.preventDefault();data.identity={title:val('ad-title'),school:val('ad-school'),instruction:val('ad-instruction'),creator:val('ad-creator')};closeModal();save()} function saveAppearance(e){e.preventDefault();data.appearance={bg1:val('bg1'),bg2:val('bg2'),bg3:val('bg3')};closeModal();save()} function val(id){return document.getElementById(id).value.trim()}
    function openEditor(type,id){if(type==='category'){const c=data.categories.find(x=>x.id===id);modal(`<div class="modal-head"><h2>Edit Tema</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="saveCategory(event,'${id}')">${field('Emoji','ed-emoji',c.emoji)}${field('Nama tema','ed-name',c.name)}${field('Deskripsi','ed-desc',c.description)}${colorField('Warna awal','ed-c1',c.colors[0])}${colorField('Warna akhir','ed-c2',c.colors[1])}<div class="actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`)}else{let c=data.categories.find(x=>x.subtopics.some(s=>s.id===id)),s=c.subtopics.find(x=>x.id===id);modal(`<div class="modal-head"><h2>Edit Pertanyaan</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="saveSubtopic(event,'${id}')">${field('Label','ed-label',s.label)}${field('Emoji','ed-emoji',s.emoji)}${field('Nama subtopik','ed-name',s.name)}<div class="field"><label>Pertanyaan debat</label><textarea id="ed-question" required>${esc(s.question)}</textarea></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`)}}
    function saveCategory(e,id){e.preventDefault();const c=data.categories.find(x=>x.id===id);Object.assign(c,{emoji:val('ed-emoji'),name:val('ed-name'),description:val('ed-desc'),colors:[val('ed-c1'),val('ed-c2')]});closeModal();save()} function saveSubtopic(e,id){e.preventDefault();const s=data.categories.flatMap(c=>c.subtopics).find(x=>x.id===id);Object.assign(s,{label:val('ed-label'),emoji:val('ed-emoji'),name:val('ed-name'),question:val('ed-question')});closeModal();save()}
    function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-debat-osis-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup berhasil dibuat')}
    document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.identity||!Array.isArray(d.categories))throw 0;if(confirm('Ganti seluruh data dengan file backup ini?')){data=d;save();closeModal()}}catch{toast('File backup tidak valid')}};r.readAsText(f);e.target.value=''})
    function resetData(){if(confirm('Reset seluruh perubahan ke data awal?')){data=clone(defaults);save();closeModal()}} async function changePin(e){e.preventDefault();const a=val('newpin'),b=val('confirmpin');if(a.length<4)return toast('PIN minimal 4 karakter');if(a!==b)return toast('Konfirmasi PIN tidak sama');localStorage.setItem(PIN_KEY,await hash(a));closeModal();toast('PIN berhasil diubah')}
    applyTheme();render();
  </script>
</body>
</html>
